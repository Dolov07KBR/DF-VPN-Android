name: Build DF VPN APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: V2rayNG/*.gradle.kts
      - name: Install native build dependencies
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/
      - name: Download Xray core
        run: |
          TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          curl -fL "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar" -o V2rayNG/app/libs/libv2ray.aar
      - name: Build debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace
      - name: Checksums
        run: sha256sum V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk > V2rayNG/app/build/outputs/apk/fdroid/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: DF-VPN-debug-APK
          path: |
            V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
            V2rayNG/app/build/outputs/apk/fdroid/debug/SHA256SUMS.txt

name: Build DF VPN APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: V2rayNG/*.gradle.kts
      - name: Build debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug --stacktrace
      - name: Checksums
        run: sha256sum V2rayNG/app/build/outputs/apk/debug/*.apk > V2rayNG/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DF-VPN-debug-APK
          path: |
            V2rayNG/app/build/outputs/apk/debug/*.apk
            V2rayNG/app/build/outputs/apk/debug/SHA256SUMS.txt
